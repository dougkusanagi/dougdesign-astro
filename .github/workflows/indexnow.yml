name: IndexNow

# Depois de um push no master com posts novos ou alterados, espera o Cloudflare Pages
# publicar e avisa os buscadores. Pushes feitos pelo GITHUB_TOKEN (publicação agendada)
# não disparam este workflow: lá o aviso é feito no próprio job.
on:
  push:
    branches: [master]
    paths: ['src/content/blog/**']
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Espera o deploy do Cloudflare Pages
        if: github.event_name == 'push'
        run: sleep 300
      - run: node scripts/indexnow.mjs ${{ github.event.before || 'HEAD~1' }} HEAD
