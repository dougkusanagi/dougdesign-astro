name: Editorial Scheduled Publish

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-scheduled-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install CLI dependencies
        working-directory: tools/dougseo-cli
        run: bun install

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Promote due posts
        id: promote
        run: |
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          bun --cwd ./tools/dougseo-cli src/cli.ts queue run --ci
          echo "after=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # O push do GITHUB_TOKEN não dispara outros workflows: avisa o IndexNow daqui mesmo,
      # depois de dar tempo do Cloudflare Pages publicar.
      - name: IndexNow
        if: steps.promote.outputs.before != steps.promote.outputs.after
        run: |
          sleep 300
          node scripts/indexnow.mjs ${{ steps.promote.outputs.before }} ${{ steps.promote.outputs.after }}
